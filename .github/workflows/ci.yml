name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test-scripts:
    name: Test Automation Scripts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: |
          cd scripts
          npm ci

      - name: Run linter
        run: |
          cd scripts
          npm run lint

      - name: Run tests
        run: |
          cd scripts
          npm test -- --coverage

      - name: Build TypeScript
        run: |
          cd scripts
          npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./scripts/coverage/lcov.info
          flags: scripts
          name: scripts-coverage

  test-java:
    name: Test Java Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run tests
        run: mvn test

      - name: Generate coverage report
        run: mvn jacoco:report

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: java
          name: java-coverage
